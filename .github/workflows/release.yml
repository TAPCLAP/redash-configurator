name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    name: Publish image and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Image coordinates
        id: coords
        run: |
          set -eu
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_REF_NAME}"
          echo "repo=${repo}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${repo}:${tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.coords.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.coords.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write the release notes
        run: |
          set -eu
          previous="$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          if [ -n "${previous}" ]; then
            changes="$(git log --no-merges --pretty=format:'- %s (%h)' "${previous}..HEAD")"
          else
            changes="$(git log --no-merges --pretty=format:'- %s (%h)')"
          fi
          if [ -z "${changes}" ]; then
            changes="- ${GITHUB_REF_NAME}"
          fi
          {
            echo "## Image"
            echo
            echo "\`${{ steps.coords.outputs.image }}\`"
            echo
            echo "The image reads its configuration from environment variables and reconciles MySQL data sources in Redash. Run a single replica."
            echo
            echo "## Changes"
            echo
            printf '%s\n' "${changes}"
          } > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.coords.outputs.tag }}" \
            --title "${{ steps.coords.outputs.tag }}" \
            --notes-file release-notes.md
